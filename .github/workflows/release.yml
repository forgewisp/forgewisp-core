name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm version is pinned via packageManager in package.json (pnpm@9.15.9);
      # pnpm/action-setup@v4 reads it automatically, so no explicit version here.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Verify the git tag matches every publishable package's version before any
      # publish. Both @forgewisp/core and @forgewisp/bundled-tools version in
      # lockstep with the release tag, so a mismatch on either fails the run.
      - name: Check tag/version parity
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          for pkg in packages/core packages/bundled-tools; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$TAG" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG does not match $pkg/package.json version $PKG_VERSION"
              exit 1
            fi
            echo "Tag v$TAG matches $pkg version $PKG_VERSION"
          done

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - name: Publish @forgewisp/core to npm
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Use pnpm publish (not npm publish) for @forgewisp/bundled-tools: its
      # dependency on @forgewisp/core is declared as "workspace:*", and only
      # pnpm rewrites the workspace protocol to the resolved version when
      # packing. npm publish would publish the literal "workspace:*" string,
      # which npm rejects. Must run after core's publish so the resolved
      # version is already on the registry.
      - name: Publish @forgewisp/bundled-tools to npm
        working-directory: packages/bundled-tools
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
